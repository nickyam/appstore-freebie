name: probe-us-iap

# 临时探针：在 US runner（非大陆 IP）上扫描美区本体限免 App 是否含内购。
# 不修改任何仓库数据，仅把结果作为 artifact 上传，供本地统计后删除。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest   # GitHub 托管 = 美国 IP，可绕过 apps.apple.com/us 的 301 地理跳转
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 扫描美区内购标记
        run: python3 scripts/iap_probe.py --region us --ids-file us_free_ids.json --out us_iap_result.json --delay 0.25
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: us-iap-result
          path: us_iap_result.json

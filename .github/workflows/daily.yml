name: daily-freebie

on:
  schedule:
    # 常规班次：每 6 小时跑一次（00:00 / 06:00 / 12:00 / 18:00 UTC）
    # = 北京时间 08:00 / 14:00 / 20:00 / 02:00，捕捉日内临时限免/闪免
    # 全量回查(--full) 见同目录 daily-full.yml（每日 21:00 UTC = 北京时间 05:00）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate freebie list (cn)
        run: python scripts/generate.py --country cn

      - name: Generate freebie list (us)
        run: python scripts/generate.py --country us

      - name: Commit & push
        run: |
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          git add data/free-today-cn.json data/free-today-us.json data/history-cn.json data/history-us.json app/ sitemap.xml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily: App Store 限免更新 $(date -u +%Y-%m-%d)"
            # 推送前先 rebase 远端最新，避免与手动推送撞车导致 push 被拒、数据不更新
            git pull --rebase origin main
            git push
          fi

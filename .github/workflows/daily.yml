name: daily-freebie

# 合并后的主跑批工作流（由阿里云 ECS 准点触发，每日 4 班）
# ----------------------------------------
# 单工作流内串行完成三件事，取代原 daily / iap / seed 三个独立工作流（省去各自冷启动与并发组排队）：
#   1) 种子播种 —— 仅 08:13 北京（UTC 00 时）那班运行（ECS 每天只在此时段播种，其余 3 班跳过）：
#      · seed_from_apprcn.py      喂本体永久 App 宽池（history-{region}.json）
#      · seed_iap_from_apprcn.py  从反斗限免补「内购限免」候选，注入 IAP 监控池（history + iap-history）
#      反斗限免 API 偶发不可达 → continue-on-error，不阻断后续生成。
#      · check_seed_health.py     紧随其后的健康检查（无 continue-on-error）：seed 每次运行写
#                                心跳（seed_last_ok/fail 落 iap-history meta），陈旧/失败即使任务
#                                失败——把「API 不可达被静默吞掉」变成红 X 报警（2026-10-25 A 方案）。
#   2) 内购价格历史采集（iap_collector.py，cn + us）—— US 必须在非大陆 IP 跑（本 runner 即 GitHub 托管，非 CN）；
#      同样 continue-on-error，采集抽风不会拖垮本体更新。
#      扫描量按班次：播种班（UTC 00/01）limit=0 即全池覆盖（cn≈6144 / us≈8484，约 3.2h 整班）；
#      其余 3 班 limit=2000 快速刷新热点。依据：仓库 2026-10-26 转为 public，
#      标准 runner 分钟对公开仓库完全免费，故不再受 2000 分钟额度约束。
#   3) 双区生成（generate.py）—— 产出首页数据 + 全部 App 独立页（含 IAP 页）+ 资源戳 + sitemap。
# 全量回查（--full）见同目录 daily-full.yml（每日 21:17 UTC = 北京时间 05:17），保持独立（不同 cadence、更重）。
#
# 与 daily-full.yml 共用并发组 freebie-update：班次之间串行，避免互相抢推 main。
on:
  # ⚠️ 定时不再由 GitHub 自带 cron 驱动：GitHub 免费 runner 的 schedule 会排队
  # 滞后 2~5 小时（实测，2026-10 多次），根本做不到准点。
  # 改由「阿里云 ECS 在精确北京时刻（02:13 / 08:13 / 14:13 / 20:13）调用
  # /root/freebie-deploy/trigger_daily.sh → workflow_dispatch」驱动，延迟降到分钟级。
  # daily-full.yml 仍保留 GitHub 自带定时（每日 05:17 北京），作为 ECS 宕机时的兜底。
  workflow_dispatch: {}

permissions:
  contents: write

# 与 daily-full.yml 共用同一并发组：班次之间串行，避免互相抢推 main。
# 背景：GitHub 定时班次实测会延迟 2~3 小时执行，延迟后极易与前后班次
# 或用户在 GitHub Desktop 的手动推送撞在一起。
concurrency:
  group: freebie-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史：下面的 git pull --rebase 需要正确的 merge base；
          # 浅克隆(depth=1)下 rebase 到已前进的远端容易直接失败。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Seed from apprcn (仅 08:13 北京班)
        continue-on-error: true
        run: |
          HR=$(date -u +%H)
          # ECS 每天固定 02:13/08:13/14:13/20:13 北京触发；只有 08:13（UTC 00）这班播种。
          # 兼容 dispatch 可能略晚跨到 UTC 01，故 00/01 都放行；其余时段跳过，避免每天播种 4 次。
          if [ "$HR" != "00" ] && [ "$HR" != "01" ]; then
            echo "非播种时段（仅 08:13 北京 / UTC 00 时播种），跳过"
            exit 0
          fi
          python scripts/seed_from_apprcn.py

      - name: Seed IAP from apprcn (仅 08:13 北京班)
        continue-on-error: true
        run: |
          HR=$(date -u +%H)
          if [ "$HR" != "00" ] && [ "$HR" != "01" ]; then
            echo "非播种时段（仅 08:13 北京 / UTC 00 时播种），跳过"
            exit 0
          fi
          python scripts/seed_iap_from_apprcn.py

      - name: Collect IAP prices (cn)
        continue-on-error: true
        run: |
          # 公开仓库后标准 runner 分钟完全免费（2026-10-26 仓库转为 public），
          # 故播种班（北京 08:13 = UTC 00/01 时）扫全量池（cn≈6144），
          # 其余 3 班仍扫 2000，保持"轻快刷新热点"的节奏。
          HR=$(date -u +%H)
          if [ "$HR" = "00" ] || [ "$HR" = "01" ]; then LIMIT=0; else LIMIT=2000; fi
          echo "cn 内购采集：limit=$LIMIT（0 = 全量）"
          python scripts/iap_collector.py --region cn --limit $LIMIT --delay 0.3

      - name: Collect IAP prices (us)
        continue-on-error: true
        run: |
          HR=$(date -u +%H)
          if [ "$HR" = "00" ] || [ "$HR" = "01" ]; then LIMIT=0; else LIMIT=2000; fi
          echo "us 内购采集：limit=$LIMIT（0 = 全量）"
          python scripts/iap_collector.py --region us --limit $LIMIT --delay 0.3

      - name: Generate freebie list (cn)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country cn; then exit 0; fi
            echo "::warning::cn 生成失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::cn 生成连续 3 次失败"
          exit 1

      - name: Generate freebie list (us)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country us; then exit 0; fi
            echo "::warning::us 生成失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::us 生成连续 3 次失败"
          exit 1

      - name: Commit & push
        run: |
          set -e
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          # PATHS 必须覆盖 generate.py 与采集器会改写的全部文件：
          # 除 data/app/sitemap 外，stamp_asset_version() 与 sync_includes() 会全量遍历
          # 改写所有 .html（含 6 个根级静态页）；漏加会导致「已改未暂存」→ git pull --rebase 拒绝 → 整班红。
          PATHS="data/free-today-cn.json data/free-today-us.json data/history-cn.json data/history-us.json data/iap-current-free-cn.json data/iap-current-free-us.json data/iap-free-cn.json data/iap-free-us.json data/iap-history-cn.json data/iap-history-us.json data/.seed_iap_apprcn_manifest.json index.html about.html privacy.html terms.html 404.html app-page.html app/ sitemap.xml"
          MSG="daily: App Store 限免更新 $(date -u +%Y-%m-%d)"

          # 组合准备：种子(限08:13北京班) + 内购采集 + 双区生成（带 3 次重试）。
          # 供「push 被拒重试」路径复用：reset --hard 会清空工作树，重试必须重新采集/生成，
          # 否则刚采的内购数据会丢失（至多陈旧 6 小时，可接受但应避免）。
          prepare() {
            HR=$(date -u +%H)
            if [ "$HR" = "00" ] || [ "$HR" = "01" ]; then
              python scripts/seed_from_apprcn.py || echo "::warning::apprcn 播种失败（非致命，沿用已有 history）"
              python scripts/seed_iap_from_apprcn.py || echo "::warning::iap apprcn 播种失败（非致命，沿用已有 history）"
            fi
            # 与「Collect IAP prices」步骤保持一致：播种班全量，其余班 2000
            if [ "$HR" = "00" ] || [ "$HR" = "01" ]; then LIMIT=0; else LIMIT=2000; fi
            python scripts/iap_collector.py --region cn --limit $LIMIT --delay 0.3 || echo "::warning::cn 内购采集失败（非致命）"
            python scripts/iap_collector.py --region us --limit $LIMIT --delay 0.3 || echo "::warning::us 内购采集失败（非致命）"
            for i in 1 2 3; do
              if python scripts/generate.py --country cn && python scripts/generate.py --country us; then return 0; fi
              echo "::warning::生成失败（第 $i 次），20 秒后重试"
              sleep 20
            done
            return 1
          }

          # 以远端最新 main 为基重新生成再提交推送（生成物确定性，安全）。
          # 重试循环：跑批期间用户常在 GitHub Desktop 手动推送，push 竞争可持续数分钟，
          # 单次重试不够（2026-10-22 两班红 X 即撞在用户高频推送上）——循环最多 5 次。
          regenerate_and_push() {
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              prepare || { echo "::error::重试第 $i 次：准备失败"; return 1; }
              git add $PATHS
              git commit -m "$MSG" || true
              if git push; then
                echo "推送成功（第 $i 次尝试）"
                return 0
              fi
              echo "::warning::push 被拒（第 $i 次），10 秒后重试"
              sleep 10
            done
            return 1
          }

          git add $PATHS
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "$MSG"
          # 推送前 rebase 到远端最新：跑批期间用户常在 GitHub Desktop 手动推送，
          # 双方若改到同一行（资源戳 / 生成的 HTML）会 rebase 冲突 → 整班红。
          if ! git pull --rebase origin main; then
            echo "::warning::rebase 冲突 → 基于最新 main 重新生成"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::push 被拒 → 进入重试循环（最多 5 次）"
            regenerate_and_push
          fi

      # A 方案（防静默失败）——放在最后：即使播种心跳异常，本次采集/生成/推送也已落地，
      # 红 X 只作报警、绝不阻断数据更新（放在 seed 之后会因健康检查失败而中断生成，已挪到末位）。
      # 读的是最近一次播种写入的心跳：缺失 / 陈旧 >30h / 最近失败晚于成功 → 任务失败（红 X）。
      # 非播种时段也检查（读上班次心跳），防「从来没人播种成功」。
      - name: Seed health check (防静默失败，末班报警，不阻断数据)
        run: python scripts/check_seed_health.py

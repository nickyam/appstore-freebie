name: daily-freebie

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate freebie list (cn)
        run: python scripts/generate.py --country cn

      - name: Generate freebie list (us)
        run: python scripts/generate.py --country us

      - name: Commit & push
        run: |
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          git add data/free-today-cn.json data/free-today-us.json data/baseline-cn.json data/baseline-us.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily: App Store 限免更新 $(date -u +%Y-%m-%d)"
            git push
          fi

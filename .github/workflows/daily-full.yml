name: daily-freebie-full

# 全量回查（每日一班）
# ----------------
# 常规班次(daily.yml)每 6 小时只扫「榜单 App + 促销中可能掉榜的库内 App」，速度快；
# 但纯长尾/已掉榜 App 的缓慢价格变化（如悄悄恢复原价、悄悄下架）不会被常规班次捕捉。
# 本工作流每日一班对「永久 App 库」做全量回查(--full)，抓长尾 + 累计 miss 触发下架清理。
# 由 ECS 在北京时间 04:00 精点触发（workflow_dispatch），夹在 02:13 班收工与 08:13 播种班之间，左右缓冲 40min / 2h+。
on:
  workflow_dispatch: {}

permissions:
  contents: write

# 与 daily.yml / seed.yml 共用同一并发组：班次之间串行，避免互相抢推 main。
concurrency:
  group: freebie-update
  cancel-in-progress: false

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史：git pull --rebase 需要正确的 merge base
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Full rescan (cn)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country cn --full; then exit 0; fi
            echo "::warning::cn 全量回查失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::cn 全量回查连续 3 次失败"
          exit 1

      - name: Full rescan (us)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country us --full; then exit 0; fi
            echo "::warning::us 全量回查失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::us 全量回查连续 3 次失败"
          exit 1

      - name: Commit & push
        run: |
          set -e
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          # PATHS 必须覆盖 generate.py 会改写的全部文件（含 6 个根级静态页：
          # stamp_asset_version()/sync_includes() 会全量改写所有 .html；漏加会导致
          # 「已改未暂存」→ git pull --rebase 拒绝 → 整班红）
          # 🔴 iap-free-{region}.json 也必须在列：generate.py 的 backfill_iap_page_fields()
          # 会在出页后回写该文件的 page 指针（消除首页内购卡片直跳 App Store），
          # 漏加 → 工作树残留未暂存改动 → rebase 报 unstaged → 整班红。
          PATHS="data/free-today-cn.json data/free-today-us.json data/history-cn.json data/history-us.json data/iap-free-cn.json data/iap-free-us.json index.html about.html privacy.html terms.html 404.html app-page.html app/ sitemap.xml"
          MSG="daily-full: App Store 全量回查 $(date -u +%Y-%m-%d)"

          # 双区全量生成（带 3 次重试；Apple 接口偶发超时/限流）
          gen() {
            for i in 1 2 3; do
              if python scripts/generate.py --country cn --full && python scripts/generate.py --country us --full; then return 0; fi
              echo "::warning::全量生成失败（第 $i 次），20 秒后重试"
              sleep 20
            done
            return 1
          }

          # 以远端最新 main 为基重新生成再提交推送（生成物确定性，安全）。
          # 重试循环：跑批期间用户常在 GitHub Desktop 手动推送，push 竞争可持续数分钟，
          # 单次重试不够（2026-10-22 两班红 X 即撞在用户高频推送上）——循环最多 5 次。
          regenerate_and_push() {
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              gen || { echo "::error::重试第 $i 次：生成失败"; return 1; }
              git add $PATHS
              git commit -m "$MSG" || true
              if git push; then
                echo "推送成功（第 $i 次尝试）"
                return 0
              fi
              echo "::warning::push 被拒（第 $i 次），10 秒后重试"
              sleep 10
            done
            return 1
          }

          git add $PATHS
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "$MSG"
          # 跑批期间用户可能在 GitHub Desktop 手动推送，撞同一行会 rebase 冲突 → 整班红；
          # 冲突时以最新 main 为基重新生成（生成物确定性，安全）再推。
          if ! git pull --rebase origin main; then
            echo "::warning::rebase 冲突 → 基于最新 main 重新生成"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::push 被拒 → 进入重试循环（最多 5 次）"
            regenerate_and_push
          fi

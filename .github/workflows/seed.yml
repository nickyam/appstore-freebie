name: daily-seed

# 每日播种（喂料）
# ----------------
# 从「反斗限免」(apprcn) 拉取当前 iOS 本体限免清单，增量写入永久 App 库
# data/history-{cn,us}.json（只补库里没有的 App，绝不覆盖已有价格历史）。
# 之后立刻跑一遍 generate 双区，让当天早上首页立即包含这批新种子 App，
# 不用干等 08:00(北京时间) 那班常规 generate。
#
# 定时：UTC 23:11 = 北京时间次日 07:11（赶在 08:13 常规班次之前完成喂料，且错开整点高峰）。
# 与 daily.yml(每6h) / daily-full.yml(每日05:00北京) 错开，共用同一并发组串行执行。
on:
  schedule:
    - cron: "11 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 与 daily.yml / daily-full.yml 共用同一并发组：班次之间串行，避免互相抢推 main。
concurrency:
  group: freebie-update
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史：git pull --rebase 需要正确的 merge base
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Seed iOS 本体限免 from apprcn
        # apprcn 偶发不可达时允许失败，不阻断后续 generate（基于已有 history 仍正常产出）
        continue-on-error: true
        run: python scripts/seed_from_apprcn.py

      - name: Generate freebie list (cn)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country cn; then exit 0; fi
            echo "::warning::cn 生成失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::cn 生成连续 3 次失败"
          exit 1

      - name: Generate freebie list (us)
        run: |
          for i in 1 2 3; do
            if python scripts/generate.py --country us; then exit 0; fi
            echo "::warning::us 生成失败（第 $i 次），20 秒后重试"
            sleep 20
          done
          echo "::error::us 生成连续 3 次失败"
          exit 1

      - name: Commit & push
        run: |
          set -e
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          # PATHS 必须覆盖 generate.py 会改写的全部文件（含 6 个根级静态页：
          # stamp_asset_version()/sync_includes() 会全量改写所有 .html；漏加会导致
          # 「已改未暂存」→ git pull --rebase 拒绝 → 整班红）
          PATHS="data/free-today-cn.json data/free-today-us.json data/history-cn.json data/history-us.json index.html about.html privacy.html terms.html 404.html app-page.html app/ sitemap.xml"
          MSG="seed: 反斗限免每日播种 $(date -u +%Y-%m-%d)"

          # 双区生成（带 3 次重试；Apple 接口偶发超时/限流）
          gen() {
            for i in 1 2 3; do
              if python scripts/generate.py --country cn && python scripts/generate.py --country us; then return 0; fi
              echo "::warning::生成失败（第 $i 次），20 秒后重试"
              sleep 20
            done
            return 1
          }

          # 以远端最新 main 为基重新生成再提交推送（生成物确定性，安全）。
          # 重试循环：跑批期间用户常在 GitHub Desktop 手动推送，push 竞争可持续数分钟，
          # 单次重试不够（2026-10-22 两班红 X 即撞在用户高频推送上）——循环最多 5 次。
          regenerate_and_push() {
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              python scripts/seed_from_apprcn.py || echo "::warning::apprcn 播种失败（非致命，沿用已有 history）"
              gen || { echo "::error::重试第 $i 次：生成失败"; return 1; }
              git add $PATHS
              git commit -m "$MSG" || true
              if git push; then
                echo "推送成功（第 $i 次尝试）"
                return 0
              fi
              echo "::warning::push 被拒（第 $i 次），10 秒后重试"
              sleep 10
            done
            return 1
          }

          git add $PATHS
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "$MSG"
          # 跑批期间用户可能在 GitHub Desktop 手动推送，撞同一行会 rebase 冲突 → 整班红；
          # 冲突时以最新 main 为基重新生成（生成物确定性，安全）再推。
          if ! git pull --rebase origin main; then
            echo "::warning::rebase 冲突 → 基于最新 main 重新生成"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::push 被拒 → 进入重试循环（最多 5 次）"
            regenerate_and_push
          fi

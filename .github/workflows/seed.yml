name: daily-seed

# 每日播种（喂料）
# ----------------
# 从「反斗限免」(apprcn) 拉取当前 iOS 本体限免清单，增量写入永久 App 库
# data/history-{cn,us}.json（只补库里没有的 App，绝不覆盖已有价格历史）。
# 之后立刻跑一遍 generate 双区，让当天早上首页立即包含这批新种子 App，
# 不用干等 08:00(北京时间) 那班常规 generate。
#
# 定时：UTC 23:00 = 北京时间次日 07:00（赶在 08:00 常规班次之前完成喂料）。
# 与 daily.yml(每6h) / daily-full.yml(每日05:00北京) 错开，且都用 rebase 兜底撞车。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Seed iOS 本体限免 from apprcn
        # apprcn 偶发不可达时允许失败，不阻断后续 generate（基于已有 history 仍正常产出）
        continue-on-error: true
        run: python scripts/seed_from_apprcn.py

      - name: Generate freebie list (cn)
        run: python scripts/generate.py --country cn

      - name: Generate freebie list (us)
        run: python scripts/generate.py --country us

      - name: Commit & push
        run: |
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          git add data/free-today-cn.json data/free-today-us.json data/history-cn.json data/history-us.json app/ sitemap.xml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "seed: 反斗限免每日播种 $(date -u +%Y-%m-%d)"
            # 推送前先 rebase 远端最新，避免与手动/常规班次推送撞车
            git pull --rebase origin main
            git push
          fi

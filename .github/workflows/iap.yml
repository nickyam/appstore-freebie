name: iap-freebie

on:
  schedule:
    # 每 6 小时跑一次（00:43 / 06:43 / 12:43 / 18:43 UTC 错峰，比 daily 的 :13 晚 30 分钟）：
    # = 北京时间 08:43 / 14:43 / 20:43 / 02:43，与本体限免同 cadence，让首页内购列表与独立页同样新鲜。
    # 与 daily*.yml 同并发组、串行，避免抢推 main。
    - cron: "43 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 与所有跑批工作流共用并发组，保证串行。
concurrency:
  group: freebie-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest   # GitHub 托管 runner 位于美国 → US 商店页不会被地理跳回 CN
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Collect IAP prices (cn)
        run: python scripts/iap_collector.py --region cn --limit 2000 --delay 0.3

      - name: Collect IAP prices (us)
        run: python scripts/iap_collector.py --region us --limit 2000 --delay 0.3

      - name: Commit & push
        run: |
          set -e
          git config user.email "freebie-bot@users.noreply.github.com"
          git config user.name "Freebie Bot"
          # 本工作流专属产物：iap 价格历史 + 限免事件。不要塞进 daily*.yml 的 PATHS。
          PATHS="data/iap-history-cn.json data/iap-history-us.json data/iap-free-cn.json data/iap-free-us.json data/iap-current-free-cn.json data/iap-current-free-us.json"
          MSG="iap: 内购价格历史更新 $(date -u +%Y-%m-%d)"

          regenerate_and_commit() {
            git fetch origin main
            git reset --hard origin/main
            python scripts/iap_collector.py --region cn --limit 2000 --delay 0.3
            python scripts/iap_collector.py --region us --limit 2000 --delay 0.3
            git add $PATHS
            git commit -m "$MSG (rerun)" || true
          }

          git add $PATHS
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "$MSG"
          if ! git pull --rebase origin main; then
            echo "::warning::rebase 冲突 → 重置到最新 main 后重跑采集"
            git rebase --abort || true
            regenerate_and_commit
          fi
          if ! git push; then
            echo "::warning::push 被拒 → 重置到最新 main 后重跑采集再推"
            git rebase --abort || true
            regenerate_and_commit
            git push
          fi

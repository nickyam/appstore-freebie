# ============================================================
# freebie.limzero.com —— 阿里云 ECS / OpenResty(Nginx) 配置
# 用途：把 appstore-freebie 静态站镜像到已备案的 limzero.com 子域，
#       让国内访客直连阿里云，绕开 Cloudflare 在大陆的慢链路。
# ============================================================
#
# 方式一（推荐，用 1Panel）：
#   在 1Panel → 网站 → 创建「静态网站」freebie.limzero.com，
#   根目录填 /www/sites/freebie.limzero.com/html，证书用 acme.sh / 1Panel 一键 Let's Encrypt。
#   然后把下方【额外配置片段】粘贴到 网站 → 设置 → 配置文件(额外配置) 里即可。
#
# 方式二（手动管 OpenResty）：
#   把整段 server 块保存为 /usr/local/openresty/nginx/conf/vhost/freebie.limzero.com.conf
#   （或你 1Panel 的 vhost 目录），include 进主配置后 reload。
#   证书路径按 certbot/1Panel 实际签发位置修改。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name freebie.limzero.com;

    #  HTTP → HTTPS（1Panel 创建站点时会自动加 443 + 证书，这段仅手动部署时需要）
    # return 301 https://$host$request_uri;

    root /www/sites/freebie.limzero.com/html;   # 与 sync.sh 的 DEPLOY_DIR 保持一致
    index index.html;

    # 禁止对外暴露 .git（仓库直接 clone 到根目录，务必加这条）
    location ~ /\.git { deny all; }

    # 静态资源长缓存（带内容哈希或改动少，可激进缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON 数据每日更新，短缓存 + 必须回源校验
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA/历史回退（本站是纯静态多页，兜底到 index.html 即可）
    location / {
        try_files $uri $uri/ /index.html;
    }
}


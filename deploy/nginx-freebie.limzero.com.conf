# ============================================================
# freebie.limzero.com —— OpenResty vhost（1Panel 静态网站）
# 用途：把 appstore-freebie 静态站镜像到已备案的 limzero.com 子域，
#       让国内访客直连阿里云，绕开 Cloudflare 在大陆的慢链路。
#
# 站点根目录（容器内）：/www/sites/freebie.limzero.com/index
#   ↔ 宿主机真实路径：/opt/1panel/apps/openresty/openresty/www/sites/freebie.limzero.com/index
#   （OpenResty 容器把宿主机 .../www 挂载为容器内 /www）
#   注意：1Panel 静态网站约定用 index 目录（不是 html），sync.sh 的 DEPLOY_DIR 已同步。
#
# 证书：阿里云「个人测试证书(免费版)」DigiCert DV，效期至 2027-01-16（仅 90 天，到期需更换）
#   文件在 .../sites/freebie.limzero.com/ssl/{fullchain.pem, privkey.pem}
#
# 🔴 为什么必须用 HTTPS（重要，别改回纯 HTTP）：
#   阿里云对已备案大陆 ECS 的 80 端口【明文流量】做内容合规扫描，命中即劫持。
#   现象：响应头 `Server: Beaver`，正文跳 batit.aliyun.com/alreject.html，
#         页面是「DO NOT ENTER 该内容被禁止访问」。它透明劫持——请求其实已到达
#         nginx（access.log 有记录），但返回客户端的响应被替换成 403 拦截页。
#         连 /.well-known/acme-challenge/ 和 5 字节纯文本文件都会被拦，
#         所以【acme.sh --webroot 这条 HTTP-01 签证书的路走不通】。
#   因为要解密明文响应才能扫描，所以【443 完全不受影响】。主域 limzero.com 的
#   http 同样被拦（平时大家都在用 https，所以一直没发现）。
#   → 本站在阿里云上只能以 HTTPS 对外，80 端口仅保留给跳转。
# ============================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name freebie.limzero.com;

    root /www/sites/freebie.limzero.com/index;
    index index.html index.htm default.htm;

    access_log /www/sites/freebie.limzero.com/log/access.log main;
    error_log /www/sites/freebie.limzero.com/log/error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 禁止对外暴露 .git / .github 等（仓库直接 clone 到站点根目录，务必加这条，
    # 否则攻击者可直接下载完整源码）
    location ~ /\.(git|github|svn) {
        deny all;
        access_log off;
    }

    # ACME 验证目录（保留备用；注意阿里云会拦 80 明文流量，此路径实际可能不可达）
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /www/sites/freebie.limzero.com/index;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON 数据每日更新，短缓存 + 必须回源校验
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA/历史回退（本站是纯静态多页，兜底到 index.html 即可）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- HTTPS ----
    if ($scheme = http) { return 301 https://$host$request_uri; }
    ssl_certificate     /www/sites/freebie.limzero.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/freebie.limzero.com/ssl/privkey.pem;
    # 只保留 TLSv1.3 / TLSv1.2（1Panel 默认还会带上 TLSv1.1/1.0，已去除）
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
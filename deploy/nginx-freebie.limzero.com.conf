# ============================================================
# freebie.limzero.com —— 阿里云 ECS / OpenResty(Nginx) 配置
# 用途：把 appstore-freebie 静态站镜像到已备案的 limzero.com 子域，
#       让国内访客直连阿里云，绕开 Cloudflare 在大陆的慢链路。
#
# 容器内 /www/sites/freebie.limzero.com 对应宿主机真实路径：
#   /opt/1panel/apps/openresty/openresty/www/sites/freebie.limzero.com
# （OpenResty 容器把宿主机 .../www 挂载为容器内 /www）
#
# 当前状态（2026-10-19）：【HTTP 先行】已上线，证书签发暂缓。
# 后续补 HTTPS 时：启用下方 listen 443 / ssl_* / http→https 跳转即可。
# ============================================================
server {
    listen 80;
    # listen 443 ssl http2;   # ← 证书就绪后取消注释
    server_name freebie.limzero.com;

    root /www/sites/freebie.limzero.com/html;   # 与 sync.sh 的 DEPLOY_DIR 保持一致（容器内路径）
    index index.html;

    access_log /www/sites/freebie.limzero.com/log/access.log main;
    error_log  /www/sites/freebie.limzero.com/log/error.log;

    # ACME 验证目录（签发证书时需要，HTTP 下保留无害）
    location ^~ /.well-known/acme-challenge { allow all; root /www/sites/freebie.limzero.com/html; }

    # 禁止对外暴露 .git（仓库直接 clone 到根目录，务必加这条）
    location ~ /\.git { deny all; }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON 数据每日更新，短缓存 + 必须回源校验
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA/历史回退（本站是纯静态多页，兜底到 index.html 即可）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 证书就绪后启用 ↓↓↓
    # if ($scheme = http) { return 301 https://$host$request_uri; }
    # ssl_certificate     /www/sites/freebie.limzero.com/ssl/fullchain.pem;
    # ssl_certificate_key /www/sites/freebie.limzero.com/ssl/privkey.pem;
    # ssl_protocols TLSv1.3 TLSv1.2;
    # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # error_page 497 https://$host$request_uri;
    # add_header Strict-Transport-Security "max-age=31536000";
}
